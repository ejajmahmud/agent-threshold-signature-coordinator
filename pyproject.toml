[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-threshold-signature-coordinator"
version = "0.1.0"
description = "M-of-N threshold authorization coordinator requiring cryptographic quorum before executing high-risk tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-threshold-signature-coordinator = "agent_threshold_signature_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_threshold_signature_coordinator*"]
